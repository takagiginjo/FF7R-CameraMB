name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Sparse clones: only include/ is needed, avoids pulling submodules and NVIDIA binaries
      - name: Fetch headers
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git deps/dlss
          git -C deps/dlss sparse-checkout set include
          git clone --depth 1 --branch v6.4.1 --filter=blob:none --sparse https://github.com/crosire/reshade.git deps/reshade
          git -C deps/reshade sparse-checkout set include

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DFETCHCONTENT_SOURCE_DIR_DLSS="$GITHUB_WORKSPACE/deps/dlss"
          -DFETCHCONTENT_SOURCE_DIR_RESHADE="$GITHUB_WORKSPACE/deps/reshade"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff7_camera_motion_blur
          path: build/Release/ff7_camera_motion_blur.addon64

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/ff7_camera_motion_blur.addon64
